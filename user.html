<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StreamHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Monetag Rewarded Interstitial SDK (zone 11534532) -->
<script src='//libtl.com/sdk.js' data-zone='11534532' data-sdk='show_11534532'></script>
<!-- Firebase (compat SDK for simplicity in a single-file app) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --grad-a:#6C5CE7; --grad-b:#00D2FF;
  --accent:#FF4B6E;
  --bg-dark:#0B0B14; --surface-dark:#14141F; --glass-dark:rgba(255,255,255,0.06);
  --bg-light:#F5F6FB; --surface-light:#FFFFFF; --glass-light:rgba(255,255,255,0.7);
  --text-dark:#F2F2F7; --text-dim-dark:#9A9AB0;
  --text-light:#14141F; --text-dim-light:#6B6B80;
  --border-dark:rgba(255,255,255,0.08); --border-light:rgba(0,0,0,0.08);
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  --shadow-soft:0 10px 30px rgba(0,0,0,0.25);
  --nav-h:64px;
}
[data-theme="dark"]{--bg:var(--bg-dark);--surface:var(--surface-dark);--glass:var(--glass-dark);--text:var(--text-dark);--text-dim:var(--text-dim-dark);--border:var(--border-dark);}
[data-theme="light"]{--bg:var(--bg-light);--surface:var(--surface-light);--glass:var(--glass-light);--text:var(--text-light);--text-dim:var(--text-dim-light);--border:var(--border-light);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text);
  overflow-x:hidden; transition:background .3s ease,color .3s ease;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
img,video{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; border:none; cursor:pointer; background:none; color:inherit;}
::-webkit-scrollbar{display:none;}

/* ===================== TOP BAR ===================== */
.topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; backdrop-filter:blur(16px); background:var(--glass); border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:20px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--grad-a),var(--grad-b));}
.brand span.grad{background:linear-gradient(135deg,var(--grad-a),var(--grad-b)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.top-actions{display:flex; align-items:center; gap:14px; font-size:18px;}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--border); position:relative;}

/* ===================== PAGES / TRANSITIONS ===================== */
.page{display:none; animation:fadeIn .35s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ===================== SKELETONS ===================== */
.skeleton{background:linear-gradient(90deg,var(--glass) 25%, var(--border) 37%, var(--glass) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite;}
@keyframes sk{0%{background-position:100% 0;}100%{background-position:0 0;}}
.skel-card{border-radius:var(--radius-md); overflow:hidden; margin:12px;}
.skel-thumb{width:100%; aspect-ratio:16/9;}
.skel-line{height:12px; margin:8px 12px; border-radius:6px;}

/* ===================== FEED ===================== */
.feed{padding:8px 0 20px;}
.video-card{
  margin:14px 12px; border-radius:var(--radius-lg); overflow:hidden; background:var(--surface);
  border:1px solid var(--border); box-shadow:var(--shadow-soft); transition:transform .2s ease;
}
.video-card:active{transform:scale(.98);}
.thumb-wrap{position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden;}
.thumb-wrap img{width:100%; height:100%; object-fit:cover;}
.duration-badge{position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.75); color:#fff; font-size:11px; padding:3px 7px; border-radius:6px; font-weight:500;}
.card-body{display:flex; gap:10px; padding:12px;}
.avatar{width:38px;height:38px;border-radius:50%; background:linear-gradient(135deg,var(--grad-a),var(--grad-b)); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; flex-shrink:0; font-size:14px;}
.card-meta{flex:1; min-width:0;}
.card-title{font-size:15px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.card-sub{font-size:12.5px; color:var(--text-dim); margin-top:4px;}

/* ===================== BOTTOM NAV ===================== */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:60; height:var(--nav-h);
  display:flex; align-items:center; justify-content:space-around;
  background:var(--glass); backdrop-filter:blur(20px); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:var(--text-dim); width:70px; padding:6px 0; border-radius:12px; transition:.2s;}
.nav-item i{font-size:20px;}
.nav-item.active{color:var(--grad-b);}
.nav-upload{
  width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; box-shadow:0 8px 20px rgba(108,92,231,0.5);
  margin-top:-26px; position:relative;
}
.nav-upload::after{content:''; position:absolute; inset:0; border-radius:50%; animation:pulse 2.2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(108,92,231,.5);}100%{box-shadow:0 0 0 14px rgba(108,92,231,0);}}

/* ===================== RIPPLE ===================== */
.ripple{position:relative; overflow:hidden;}
.ripple-effect{position:absolute; border-radius:50%; background:rgba(255,255,255,0.4); transform:scale(0); animation:rip .55s linear;}
@keyframes rip{to{transform:scale(3); opacity:0;}}

/* ===================== TOASTS ===================== */
.toast-wrap{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; width:90%; max-width:420px;}
.toast{background:var(--surface); border:1px solid var(--border); padding:12px 16px; border-radius:var(--radius-md); box-shadow:var(--shadow-soft); font-size:13.5px; display:flex; align-items:center; gap:10px; animation:slideDown .3s ease;}
.toast i{color:var(--grad-b);}
.toast.error i{color:var(--accent);}
@keyframes slideDown{from{opacity:0; transform:translateY(-16px);} to{opacity:1; transform:translateY(0);}}

/* ===================== AUTH OVERLAY ===================== */
.overlay{position:fixed; inset:0; background:var(--bg); z-index:300; display:flex; flex-direction:column; justify-content:center; padding:28px;}
.overlay.hidden{display:none;}
.auth-logo{text-align:center; font-size:30px; font-weight:800; margin-bottom:6px;}
.auth-sub{text-align:center; color:var(--text-dim); margin-bottom:28px; font-size:13.5px;}
.field{margin-bottom:14px;}
.field label{font-size:12.5px; color:var(--text-dim); margin-bottom:6px; display:block;}
.field input{width:100%; padding:14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--glass); color:var(--text); font-family:inherit; font-size:14px;}
.btn-grad{width:100%; padding:15px; border-radius:var(--radius-sm); background:linear-gradient(135deg,var(--grad-a),var(--grad-b)); color:#fff; font-weight:600; font-size:15px; margin-top:6px;}
.auth-switch{text-align:center; margin-top:18px; font-size:13px; color:var(--text-dim);}
.auth-switch b{color:var(--grad-b); font-weight:600;}

/* ===================== UPLOAD SHEET ===================== */
.sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:150; display:none;}
.sheet-backdrop.show{display:block; animation:fadeIn .25s ease;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:151; background:var(--surface); border-radius:22px 22px 0 0; padding:20px; transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.9,.3,1); max-height:88vh; overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:40px; height:4px; background:var(--border); border-radius:4px; margin:0 auto 16px;}
.upload-drop{border:2px dashed var(--border); border-radius:var(--radius-md); padding:26px; text-align:center; color:var(--text-dim); margin-bottom:16px;}
.upload-drop i{font-size:30px; margin-bottom:8px; color:var(--grad-b);}
.progress-bar{height:8px; background:var(--glass); border-radius:8px; overflow:hidden; margin-top:10px;}
.progress-fill{height:100%; width:0%; background:linear-gradient(135deg,var(--grad-a),var(--grad-b)); transition:width .2s ease;}

/* ===================== WATCH PAGE ===================== */
.player-wrap{width:100%; background:#000; position:sticky; top:0; z-index:40;}
.player-wrap video{width:100%; max-height:56vh; background:#000;}
.watch-info{padding:14px;}
.watch-title{font-size:17px; font-weight:700; line-height:1.3; margin-bottom:8px;}
.watch-meta-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.watch-actions{display:flex; gap:10px;}
.action-pill{display:flex; align-items:center; gap:6px; padding:9px 15px; border-radius:20px; background:var(--glass); border:1px solid var(--border); font-size:13px; font-weight:500;}
.action-pill.liked{color:var(--accent); border-color:var(--accent);}
.channel-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-bottom:14px;}
.related-title{font-size:14px; font-weight:600; margin:18px 0 6px; padding:0 2px;}

/* ===================== PROFILE ===================== */
.profile-header{display:flex; flex-direction:column; align-items:center; padding:34px 20px 20px;}
.profile-avatar{width:88px; height:88px; border-radius:50%; background:linear-gradient(135deg,var(--grad-a),var(--grad-b)); display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; color:#fff; margin-bottom:12px; box-shadow:var(--shadow-soft);}
.profile-name{font-size:19px; font-weight:700;}
.profile-email{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
.stats-row{display:flex; gap:10px; margin:20px 12px;}
.stat-box{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; text-align:center;}
.stat-num{font-size:19px; font-weight:800; background:linear-gradient(135deg,var(--grad-a),var(--grad-b)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.stat-label{font-size:11px; color:var(--text-dim); margin-top:2px;}
.section-label{padding:14px 16px 4px; font-size:14px; font-weight:700;}
.logout-btn{margin:20px 16px; padding:13px; border-radius:var(--radius-sm); border:1px solid var(--accent); color:var(--accent); text-align:center; font-weight:600;}

.empty-state{text-align:center; padding:60px 24px; color:var(--text-dim);}
.empty-state i{font-size:38px; margin-bottom:12px; opacity:.6;}
.banner{margin:10px 12px; padding:12px 14px; border-radius:var(--radius-sm); background:var(--glass); border:1px solid var(--border); font-size:12.5px; color:var(--text-dim); display:flex; gap:8px; align-items:flex-start;}
.hidden{display:none !important;}
</style>
</head>
<body data-theme="dark">

<!-- ===================== TOAST CONTAINER ===================== -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- ===================== TOP BAR ===================== -->
<div class="topbar">
  <div class="brand"><div class="dot"></div><span class="grad">StreamHub</span></div>
  <div class="top-actions">
    <button class="icon-btn ripple" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
  </div>
</div>

<!-- ===================== HOME PAGE ===================== -->
<div class="page active" id="page-home">
  <div id="uploadsDisabledBanner" class="banner hidden"><i class="fa-solid fa-circle-info"></i><span>Uploads are currently disabled by the admin.</span></div>
  <div class="feed" id="feed"></div>
  <div id="feedLoader" class="skel-card"><div class="skeleton skel-thumb"></div><div class="skeleton skel-line" style="width:70%"></div><div class="skeleton skel-line" style="width:40%"></div></div>
</div>

<!-- ===================== WATCH PAGE ===================== -->
<div class="page" id="page-watch">
  <div class="player-wrap"><video id="mainPlayer" controls playsinline></video></div>

      </div>
    </div>
    <div class="channel-row">
      <div class="avatar" id="channelAvatar">U</div>
      <div><div style="font-weight:600; font-size:14px;" id="channelName"></div></div>
    </div>
    <div class="related-title">Up next</div>
    <div class="feed" id="relatedFeed"></div>

</div>

<!-- ===================== PROFILE PAGE ===================== -->
<div class="page" id="page-profile">
  <div class="profile-header">
    <div class="profile-avatar" id="profAvatar">U</div>
    <div class="profile-name" id="profName">Username</div>
    <div class="profile-email" id="profEmail">email@example.com</div>
  </div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="statVideos">0</div><div class="stat-label">Videos</div></div>

</div>

<!-- ===================== BOTTOM NAV ===================== -->
<div class="bottom-nav">
  <div class="nav-item active" data-page="home"><i class="fa-solid fa-house"></i>Home</div>
  <div class="nav-upload ripple" id="navUploadBtn"><i class="fa-solid fa-plus"></i></div>
  <div class="nav-item" data-page="profile"><i class="fa-solid fa-circle-user"></i>Profile</div>
</div>

<!-- ===================== UPLOAD SHEET ===================== -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="uploadSheet">
  <div class="sheet-handle"></div>
  <h3 style="margin-bottom:16px;">Upload video</h3>

  <button class="btn-grad ripple" id="submitUploadBtn">Upload</button>
</div>

<script>
/* ============================================================
   FIREBASE CONFIG
   Replace with your own Firebase project credentials.
   ============================================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================================
   STATE
   ============================================================ */
let uid = null;            // stable app identity key = Telegram user id (or a local guest id as fallback)
let currentUserData = null;
let tgUser = null;        // raw Telegram WebApp user object, if available
let settings = {};
let feedCache = [];       // approved videos, newest first
let feedCursor = 0;
const PAGE_SIZE = 8;
let feedLoading = false;
let feedEndReached = false;
let activeVideoId = null;

/* ============================================================
   UTIL
   ============================================================ */
function toast(msg, isError){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.innerHTML = `<i class="fa-solid ${isError?'fa-circle-exclamation':'fa-circle-check'}"></i><span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(-10px)'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 3000);
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<2592000) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
}
function fmtNum(n){
  n = n||0;
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(1)+'K';
  return String(n);
}
function initials(name){ return (name||'U').trim().charAt(0).toUpperCase(); }
document.addEventListener('click', e=>{
  const btn = e.target.closest('.ripple');
  if(!btn) return;
  const circle = document.createElement('span');
  const d = Math.max(btn.clientWidth, btn.clientHeight);
  circle.style.width = circle.style.height = d+'px';
  const rect = btn.getBoundingClientRect();
  circle.style.left = (e.clientX-rect.left-d/2)+'px';
  circle.style.top = (e.clientY-rect.top-d/2)+'px';
  circle.className = 'ripple-effect';
  btn.appendChild(circle);
  setTimeout(()=>circle.remove(),550);
});

/* ============================================================
   THEME
   ============================================================ */
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const body = document.body;
  const dark = body.getAttribute('data-theme')==='dark';
  body.setAttribute('data-theme', dark?'light':'dark');
  document.getElementById('themeToggle').innerHTML = dark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
});

/* ============================================================
   NAVIGATION
   ============================================================ */
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===name));
  window.scrollTo({top:0, behavior:'smooth'});
  if(name==='profile') loadProfile();
}
document.querySelectorAll('.nav-item').forEach(n=>{
  n.addEventListener('click', ()=> showPage(n.dataset.page));
});

/* ============================================================
   IDENTITY — automatic, no login screen, no Firebase Auth
   Identity is read straight from Telegram.WebApp.initDataUnsafe.user
   and used directly as the Realtime Database key. This only works
   because the Database Rules are open (.read/.write: true) — see
   the setup notes. The Telegram user id is the permanent profile
   key, so the same person keeps the same profile every time.
   ============================================================ */
function getTelegramUser(){
  try{
    if(window.Telegram && window.Telegram.WebApp){
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      return window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user
        ? window.Telegram.WebApp.initDataUnsafe.user : null;
    }
  }catch(e){}
  return null;
}
function localGuestId(){
  // Fallback identity for testing outside Telegram (e.g. a normal browser tab).
  let gid = localStorage.getItem('streamhub_guest_id');
  if(!gid){ gid = 'guest_' + Math.random().toString(36).slice(2,10); localStorage.setItem('streamhub_guest_id', gid); }
  return gid;
}

async function setupIdentity(){
  tgUser = getTelegramUser();
  const usingTelegram = !!tgUser;
  uid = usingTelegram ? ('tg_' + tgUser.id) : localGuestId();
  const displayName = usingTelegram
    ? (tgUser.username || [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || ('User' + tgUser.id))
    : ('Guest' + uid.slice(-4));

  try{
    const snap = await db.ref('users/'+uid).once('value');
    currentUserData = snap.val();
    if(currentUserData && currentUserData.banned){
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;color:var(--text);">Your account has been banned by an admin.</div>';
      return;
    }
    if(!currentUserData){
      currentUserData = {
        username: displayName, telegramId: usingTelegram ? tgUser.id : null,
        createdAt: Date.now(), banned:false, role:'user',
        totalVideos:0, totalViews:0, totalLikes:0
      };
      await db.ref('users/'+uid).set(currentUserData);
    }
  }catch(err){
    // Most likely cause: Realtime Database Rules aren't set to open read/write,
    // or the databaseURL in firebaseConfig is wrong/missing.
    console.error('StreamHub: could not load profile —', err.message);
    toast('Could not connect to the database: ' + err.message, true);
    currentUserData = currentUserData || { username: displayName, totalVideos:0, totalViews:0, totalLikes:0 };
  }
  initApp();
}
setupIdentity();

/* ============================================================
   APP INIT — SETTINGS + FEED
   ============================================================ */
let appInited = false;
let deepLinkHandled = false;
function initApp(){
  if(appInited) return;
  appInited = true;
  db.ref('settings').on('value', snap=>{
    settings = snap.val() || {};
    document.getElementById('uploadsDisabledBanner').classList.toggle('hidden', settings.uploadsEnabled !== false);
    if(!deepLinkHandled){
      deepLinkHandled = true;
      // If this app was opened via a shared link (Telegram bot startapp
      // parameter), jump straight to that video once settings (incl.
      // whether ads are enabled) have loaded.
      try{
        const startParam = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe
          ? window.Telegram.WebApp.initDataUnsafe.start_param : null;
        if(startParam) openVideo(startParam);
      }catch(e){}
    }
  });
  loadFeed();
  window.addEventListener('scroll', ()=>{
    if(document.getElementById('page-home').classList.contains('active')){
      if(window.innerHeight + window.scrollY > document.body.offsetHeight - 600){
        loadFeed();
      }
    }
  });
}

/* ============================================================
   FEED — infinite scroll over cached, approved videos
   ============================================================ */
let allVideosLoaded = false;
async function ensureVideosCached(){
  if(allVideosLoaded) return;
  const snap = await db.ref('videos').orderByChild('createdAt').once('value');
  const list = [];
  snap.forEach(child=>{
    const v = child.val();
    if(v.status === 'approved') list.push({id:child.key, ...v});
  });
  list.sort((a,b)=> b.createdAt - a.createdAt);
  feedCache = list;
  allVideosLoaded = true;
}
async function loadFeed(){
  if(feedLoading || feedEndReached) return;
  feedLoading = true;
  document.getElementById('feedLoader').style.display = 'block';
  await ensureVideosCached();
  const slice = feedCache.slice(feedCursor, feedCursor+PAGE_SIZE);
  if(slice.length === 0 && feedCursor === 0){
    document.getElementById('feed').innerHTML = `<div class="empty-state"><i class="fa-solid fa-video-slash"></i><div>No videos yet. Be the first to upload!</div></div>`;
  }
  slice.forEach(v=> document.getElementById('feed').appendChild(renderCard(v)));
  feedCursor += slice.length;
  if(slice.length < PAGE_SIZE) feedEndReached = true;
  document.getElementById('feedLoader').style.display = feedEndReached ? 'none' : 'block';
  feedLoading = false;
}
function renderCard(v){
  const card = document.createElement('div');
  card.className = 'video-card';
  card.innerHTML = `
    <div class="thumb-wrap"><img loading="lazy" src="${v.thumbnail||''}" onerror="this.style.opacity=0"></div>
    <div class="card-body">
      <div class="avatar">${initials(v.username)}</div>
      <div class="card-meta">
        <div class="card-title">${escapeHtml(v.username||'user')}</div>
        <div class="card-sub">${fmtNum(v.views)} views • ${timeAgo(v.createdAt)}</div>
      </div>
    </div>`;
  card.addEventListener('click', ()=> openVideo(v.id));
  return card;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

/* ============================================================
   REWARDED AD FLOW
   Uses Monetag's rewarded interstitial SDK (zone 11534532, loaded
   in <head>). show_11534532() returns a Promise that resolves once
   the person has watched the ad. If ads are turned off by the admin,
   or the ad SDK fails to load/serve an ad, the video still opens
   (fail-open) so people are never stuck on a blank screen.
   ============================================================ */
function playAdThenOpen(id){
  if(!settings.adsEnabled){ actuallyOpenVideo(id); return; }
  if(typeof show_11534532 === 'function'){
    show_11534532().then(()=>{
      actuallyOpenVideo(id);
    }).catch(()=>{
      actuallyOpenVideo(id);
    });
  } else {
    // SDK not loaded (e.g. blocked by an ad blocker) — don't block the video.
    actuallyOpenVideo(id);
  }
}

/* ============================================================
   WATCH PAGE
   ============================================================ */
function openVideo(id){
  playAdThenOpen(id);
}
async function actuallyOpenVideo(id){
  const v = feedCache.find(x=>x.id===id) || (await db.ref('videos/'+id).once('value')).val();
  if(!v){ toast('Video not found', true); return; }
  activeVideoId = id;
  showPage('watch');
  const player = document.getElementById('mainPlayer');
  player.src = v.url;
  player.load();
  document.getElementById('watchMeta').textContent = `${fmtNum(v.views)} views • ${timeAgo(v.createdAt)}`;
  document.getElementById('channelAvatar').textContent = initials(v.username);
  document.getElementById('channelName').textContent = v.username || 'user';
  // increment views
  db.ref('videos/'+id+'/views').transaction(cur=> (cur||0)+1);
  if(v.uploaderId){ db.ref('users/'+v.uploaderId+'/totalViews').transaction(cur=>(cur||0)+1); }
  // like state
  const likesSnap = await db.ref('likes/'+id).once('value');
  const likes = likesSnap.val() || {};
  const likeCount = Object.keys(likes).length;
  document.getElementById('likeCount').textContent = fmtNum(likeCount);
  const liked = uid && likes[uid];
  document.getElementById('likeBtn').classList.toggle('liked', !!liked);
  document.getElementById('likeBtn').innerHTML = `<i class="fa-${liked?'solid':'regular'} fa-heart"></i><span id="likeCount">${fmtNum(likeCount)}</span>`;
  document.getElementById('likeBtn').onclick = ()=> toggleLike(id);
  // related
  await ensureVideosCached();
  const related = feedCache.filter(x=>x.id!==id).slice(0,10);
  const rf = document.getElementById('relatedFeed');
  rf.innerHTML = '';
  related.forEach(v2=> rf.appendChild(renderCard(v2)));
}
async function toggleLike(id){
  if(!uid){ toast('Still connecting, try again in a moment', true); return; }
  const ref = db.ref('likes/'+id+'/'+uid);
  const snap = await ref.once('value');
  const btn = document.getElementById('likeBtn');
  if(snap.exists()){
    await ref.remove();
  } else {
    await ref.set(true);
    btn.classList.add('liked');
    btn.style.transform = 'scale(1.3)';
    setTimeout(()=> btn.style.transform='scale(1)', 200);
  }
  const likesSnap = await db.ref('likes/'+id).once('value');
  const likes = likesSnap.val() || {};
  document.getElementById('likeCount').textContent = fmtNum(Object.keys(likes).length);
  btn.classList.toggle('liked', !!likes[uid]);
  btn.querySelector('i').className = likes[uid] ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
}
document.getElementById('shareBtn').addEventListener('click', async ()=>{
  // If the admin has set a Telegram bot username, share a deep link that opens
  // the bot's Mini App directly to this video (via the startapp parameter).
  // Otherwise fall back to a plain page link.
  const url = settings.telegramBotUsername
    ? `https://t.me/${settings.telegramBotUsername}?startapp=${activeVideoId}`
    : (window.location.href.split('#')[0] + '#video=' + activeVideoId);
  if(navigator.share){
    try{ await navigator.share({title:'Check out this video', url}); }catch(e){}
  } else {
    try{ await navigator.clipboard.writeText(url); toast('Link copied to clipboard'); }catch(e){ toast(url); }
  }
});

/* ============================================================
   PROFILE
   ============================================================ */
async function loadProfile(){
  if(!uid) return;
  document.getElementById('profAvatar').textContent = initials(currentUserData.username);
  document.getElementById('profName').textContent = currentUserData.username;
  document.getElementById('profEmail').textContent = currentUserData.telegramId ? ('Telegram ID: ' + currentUserData.telegramId) : uid;
  const snap = await db.ref('videos').orderByChild('uploaderId').equalTo(uid).once('value');
  const vids = [];
  let totalViews = 0, totalLikesCount = 0;
  const promises = [];
  snap.forEach(c=>{
    const v = c.val();
    vids.push({id:c.key, ...v});
    totalViews += (v.views||0);
    promises.push(db.ref('likes/'+c.key).once('value').then(ls=>{ totalLikesCount += Object.keys(ls.val()||{}).length; }));
  });
  await Promise.all(promises);
  document.getElementById('statVideos').textContent = fmtNum(vids.length);
  document.getElementById('statViews').textContent = fmtNum(totalViews);
  document.getElementById('statLikes').textContent = fmtNum(totalLikesCount);
  const pf = document.getElementById('profileFeed');
  pf.innerHTML = '';
  if(vids.length===0){
    pf.innerHTML = `<div class="empty-state"><i class="fa-solid fa-clapperboard"></i><div>You haven't uploaded any videos yet.</div></div>`;
  } else {
    vids.sort((a,b)=>b.createdAt-a.createdAt).forEach(v=> pf.appendChild(renderCard(v)));
  }
}

/* ============================================================
   UPLOAD SHEET
   ============================================================ */
let selectedFile = null;
document.getElementById('navUploadBtn').addEventListener('click', ()=>{
  if(!uid){ toast('Still connecting, try again in a moment', true); return; }
  if(settings.uploadsEnabled === false){ toast('Uploads are currently disabled', true); return; }
  document.getElementById('sheetBackdrop').classList.add('show');
  document.getElementById('uploadSheet').classList.add('show');
});
document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);
function closeSheet(){
  document.getElementById('sheetBackdrop').classList.remove('show');
  document.getElementById('uploadSheet').classList.remove('show');
}
document.getElementById('dropZone').addEventListener('click', ()=> document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e=>{
  selectedFile = e.target.files[0];
  if(selectedFile){
    document.getElementById('dropText').textContent = `${selectedFile.name} (${(selectedFile.size/1024/1024).toFixed(1)} MB)`;
  }
});

// Capture first frame of a video file as a thumbnail (data URL)
function captureThumbnail(file){
  return new Promise((resolve)=>{
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.src = url; v.muted = true; v.playsInline = true; v.preload = 'metadata';
    v.addEventListener('loadeddata', ()=>{
      v.currentTime = Math.min(0.5, (v.duration||1)/4);
    });
    v.addEventListener('seeked', ()=>{
      try{
        const canvas = document.createElement('canvas');
        canvas.width = v.videoWidth || 320; canvas.height = v.videoHeight || 180;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      }catch(err){ resolve(''); }
      URL.revokeObjectURL(url);
    });
    v.addEventListener('error', ()=> resolve(''));
  });
}

// Decide storage backend by file size thresholds (configurable by admin)
function pickBackend(sizeBytes){
  const mb = sizeBytes/1024/1024;
  const smallLimit = (settings.smallLimitMB || 20);
  const mediumLimit = (settings.mediumLimitMB || 200);
  if(mb <= smallLimit) return 'telegram';
  if(mb <= mediumLimit) return 'catbox';
  return 'archive';
}

// All three upload functions below go through this app's own /api/* serverless
// proxy routes (deployed alongside this site on Vercel) instead of calling
// Telegram/Catbox/Archive.org directly — browsers block those direct calls
// with CORS errors when the site is hosted elsewhere (e.g. GitHub Pages/Vercel).
// See api/telegram.js, api/catbox.js, api/archive.js.
async function uploadToTelegram(file){
  const token = settings.telegramBotToken;
  const chatId = settings.telegramChannelId;
  if(!token || !chatId) throw new Error('Telegram credentials are not configured by the admin.');
  const form = new FormData();
  form.append('chat_id', chatId);
  form.append('video', file);
  const res = await fetch(`/api/telegram?token=${encodeURIComponent(token)}&method=sendVideo`, { method:'POST', body: form });
  const data = await res.json();
  if(!data.ok) throw new Error('Telegram upload failed: ' + (data.description||'unknown error'));
  const fileId = data.result.video ? data.result.video.file_id : data.result.document.file_id;
  const fileRes = await fetch(`/api/telegram?token=${encodeURIComponent(token)}&method=getFile`, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({file_id: fileId})
  });
  const fileData = await fileRes.json();
  if(!fileData.ok) throw new Error('Telegram getFile failed: ' + (fileData.description||'unknown error'));
  return `https://api.telegram.org/file/bot${token}/${fileData.result.file_path}`;
}
async function uploadToCatbox(file){
  const form = new FormData();
  form.append('reqtype', 'fileupload');
  if(settings.catboxUserHash) form.append('userhash', settings.catboxUserHash);
  form.append('fileToUpload', file);
  const res = await fetch('/api/catbox', { method:'POST', body: form });
  const text = await res.text();
  if(!text.startsWith('http')) throw new Error('Catbox upload failed: ' + text);
  return text.trim();
}
async function uploadToArchive(file){
  const key = settings.archiveAccessKey, secret = settings.archiveSecretKey;
  if(!key || !secret) throw new Error('Archive.org credentials are not configured by the admin.');
  const identifier = 'streamhub-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  const res = await fetch('/api/archive', {
    method: 'PUT',
    headers: {
      'x-access-key': key,
      'x-secret-key': secret,
      'x-identifier': identifier,
      'x-filename': file.name
    },
    body: file
  });
  const text = await res.text();
  if(!res.ok) throw new Error('Archive.org upload failed: ' + text);
  return text.trim();
}

document.getElementById('submitUploadBtn').addEventListener('click', async ()=>{
  if(!selectedFile){ toast('Please select a video file', true); return; }
  const maxMB = settings.maxUploadMB || 500;
  if(selectedFile.size/1024/1024 > maxMB){ toast(`File exceeds the ${maxMB}MB limit`, true); return; }

  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const statusEl = document.getElementById('uploadStatus');
  progressBar.classList.remove('hidden');
  progressFill.style.width = '10%';
  statusEl.textContent = 'Generating thumbnail...';

  try{
    const thumbnail = await captureThumbnail(selectedFile);
    progressFill.style.width = '30%';
    const backend = pickBackend(selectedFile.size);
    statusEl.textContent = `Uploading via ${backend}...`;
    progressFill.style.width = '55%';

    let url;
    if(backend === 'telegram') url = await uploadToTelegram(selectedFile);
    else if(backend === 'catbox') url = await uploadToCatbox(selectedFile);
    else url = await uploadToArchive(selectedFile);

    progressFill.style.width = '85%';
    statusEl.textContent = 'Saving video details...';

    const newRef = db.ref('videos').push();
    await newRef.set({
      url, thumbnail,
      uploaderId: uid, username: currentUserData.username,
      views: 0, createdAt: Date.now(),
      status: settings.autoApprove === false ? 'pending' : 'approved',
      backend
    });
    await db.ref('users/'+uid+'/totalVideos').transaction(cur=>(cur||0)+1);

    progressFill.style.width = '100%';
    statusEl.textContent = 'Upload complete!';
    toast('Video uploaded successfully');
    setTimeout(()=>{
      closeSheet();
      selectedFile = null;
      document.getElementById('dropText').textContent = 'Tap to select a video';
      progressBar.classList.add('hidden');
      progressFill.style.width = '0%';
      statusEl.textContent = '';
      allVideosLoaded = false; feedCursor = 0; feedEndReached = false;
      document.getElementById('feed').innerHTML = '';
      loadFeed();
    }, 800);
  }catch(err){
    statusEl.textContent = '';
    progressBar.classList.add('hidden');
    toast(err.message || 'Upload failed', true);
  }
});
</script>
